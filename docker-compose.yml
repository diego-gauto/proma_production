services:
  postgres:
    image: postgres:16
    container_name: proma-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-produccion_textil}
      POSTGRES_USER: ${POSTGRES_USER:-proma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-proma_dev}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - proma_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-proma} -d ${POSTGRES_DB:-produccion_textil}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  proma_postgres_data:
